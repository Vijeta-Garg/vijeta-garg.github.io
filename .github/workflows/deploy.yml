# Builds the list of uploaded files (content/manifest.js) and publishes the site.
# Runs automatically every time you push to the main branch.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Build & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan content folder for photos, videos, files, slides and blog posts
        run: node scripts/build-manifest.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
